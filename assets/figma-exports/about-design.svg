<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1380" viewBox="0 0 1440 1380">
  <defs><linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#0c121d"/></linearGradient><linearGradient id="accA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><pattern id="gridA" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".045"/></pattern><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:'JetBrains Mono',monospace}.w{fill:#f8fafc}.mu{fill:#a8b3c4}.di{fill:#7f8ca3}.t{fill:#2dd4bf}.card{fill:#101722;stroke:#94a3b8;stroke-opacity:.18}</style></defs>
  <rect width="1440" height="1380" fill="url(#bgA)"/><rect width="1440" height="1380" fill="url(#gridA)"/><rect width="1440" height="76" fill="#070b12" fill-opacity=".9" stroke="#94a3b8" stroke-opacity=".18"/><rect x="80" y="19" width="38" height="38" rx="12" fill="url(#accA)"/><text x="99" y="44" text-anchor="middle" class="m" font-size="12" font-weight="800" fill="#03201d">SP</text><text x="132" y="43" class="s w" font-size="16" font-weight="800">Sai Praneeth Kathi Moksha Gnana</text><g class="s" font-size="14" font-weight="700"><text x="1124" y="43" text-anchor="middle" class="mu">Home</text><rect x="1172" y="20" width="84" height="36" rx="18" fill="#94a3b8" fill-opacity=".1"/><text x="1214" y="43" text-anchor="middle" class="w">About</text><text x="1310" y="43" text-anchor="middle" class="mu">Contact</text></g>
  <text x="80" y="157" class="m t" font-size="13" font-weight="700" letter-spacing="2">ABOUT SAI PRANEETH</text><text x="80" y="234" class="s w" font-size="68" font-weight="800" letter-spacing="-3">Curious analyst.</text><text x="80" y="304" class="s" font-size="68" font-weight="800" letter-spacing="-3" fill="url(#accA)">Practical builder.</text><text x="80" y="355" class="s mu" font-size="18">I connect data engineering discipline, analytical judgment, and product-minded</text><text x="80" y="383" class="s mu" font-size="18">communication to build work people can trust and use.</text>
  <g transform="translate(80 450)"><rect width="840" height="330" rx="16" class="card"/><text x="28" y="38" class="m t" font-size="12" font-weight="700" letter-spacing="1.5">MY STORY</text><text x="28" y="82" class="s w" font-size="30" font-weight="800">From raw data to clear action.</text><text x="28" y="125" class="s mu" font-size="15">MS Information Systems &amp; AI candidate at UMD Smith working across analytics,</text><text x="28" y="149" class="s mu" font-size="15">cloud platforms, automation, and applied AI.</text><text x="28" y="193" class="s mu" font-size="15">Experience spans production reporting at MathCo, teaching and research at UMD,</text><text x="28" y="217" class="s mu" font-size="15">and a Microsoft-aligned capstone. The common thread is turning ambiguity into</text><text x="28" y="241" class="s mu" font-size="15">a tested, documented system.</text><text x="28" y="285" class="s mu" font-size="15">Focus: SQL · Python · analytics engineering · cloud · applied AI</text></g>
  <g transform="translate(944 450)"><rect width="416" height="330" rx="16" class="card"/><text x="28" y="38" class="m t" font-size="12" font-weight="700" letter-spacing="1.5">QUICK FACTS</text><g class="s"><text x="28" y="82" class="di" font-size="10">BASED IN</text><text x="28" y="103" class="w" font-size="15" font-weight="700">College Park, Maryland</text><path d="M28 122H388" stroke="#94a3b8" stroke-opacity=".18"/><text x="28" y="151" class="di" font-size="10">GRADUATE DEGREE</text><text x="28" y="172" class="w" font-size="15" font-weight="700">MS IS &amp; AI · Dec 2026</text><path d="M28 191H388" stroke="#94a3b8" stroke-opacity=".18"/><text x="28" y="220" class="di" font-size="10">CORE STACK</text><text x="28" y="241" class="w" font-size="15" font-weight="700">SQL · Python · BigQuery</text><path d="M28 260H388" stroke="#94a3b8" stroke-opacity=".18"/><text x="28" y="289" class="di" font-size="10">OPEN TO</text><text x="28" y="310" class="w" font-size="15" font-weight="700">Data + AI opportunities</text></g></g>
  <text x="80" y="857" class="m t" font-size="13" font-weight="700" letter-spacing="2">EXPERIENCE</text><text x="80" y="904" class="s w" font-size="38" font-weight="800">Work built around ownership and evidence.</text>
  <path d="M98 956V1260" stroke="#14b8a6" stroke-opacity=".45"/><g class="s"><circle cx="98" cy="995" r="7" fill="#2dd4bf"/><rect x="132" y="956" width="1228" height="86" rx="14" class="card"/><text x="160" y="988" class="w" font-size="18" font-weight="800">Research Assistant · University of Maryland</text><text x="160" y="1016" class="mu" font-size="13">Structured analysis, data preparation, and repeatable research workflows.</text><text x="1215" y="988" class="m di" font-size="10">SEP 2026 — PRESENT</text><circle cx="98" cy="1082" r="7" fill="#2dd4bf"/><rect x="132" y="1043" width="1228" height="86" rx="14" class="card"/><text x="160" y="1075" class="w" font-size="18" font-weight="800">Graduate Teaching Assistant · University of Maryland</text><text x="160" y="1103" class="mu" font-size="13">Technical guidance across SQL, Python, and application-development fundamentals.</text><text x="1215" y="1075" class="m di" font-size="10">JUN 2026 — PRESENT</text><circle cx="98" cy="1169" r="7" fill="#2dd4bf"/><rect x="132" y="1130" width="1228" height="86" rx="14" class="card"/><text x="160" y="1162" class="w" font-size="18" font-weight="800">Capstone Consultant · Microsoft × UMD</text><text x="160" y="1190" class="mu" font-size="13">Workflow automation with Copilot, Power Automate, Dataverse, and product UX.</text><text x="1215" y="1162" class="m di" font-size="10">JAN 2026 — PRESENT</text><circle cx="98" cy="1256" r="7" fill="#2dd4bf"/><rect x="132" y="1217" width="1228" height="86" rx="14" class="card"/><text x="160" y="1249" class="w" font-size="18" font-weight="800">Data Analyst · MathCo</text><text x="160" y="1277" class="mu" font-size="13">Analytics QA, stakeholder reporting, and retail workflow automation.</text><text x="1215" y="1249" class="m di" font-size="10">JAN 2024 — JUL 2025</text></g>
</svg>
