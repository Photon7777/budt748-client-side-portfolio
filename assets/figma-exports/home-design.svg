  <g transform="translate(845 142)" filter="url(#shadow)"><rect width="515" height="480" rx="20" class="card"/><circle cx="30" cy="30" r="4" fill="#14b8a6"/><circle cx="44" cy="30" r="4" fill="#7f8ca3"/><circle cx="58" cy="30" r="4" fill="#7f8ca3"/><rect x="340" y="18" width="150" height="26" rx="13" fill="#94a3b8" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".18"/><text x="415" y="35" text-anchor="middle" class="mono dim" font-size="9">analytics_pipeline.py</text><rect x="26" y="82" width="220" height="106" rx="14" fill="#070b12" fill-opacity=".7" stroke="#94a3b8" stroke-opacity=".18"/><text x="44" y="108" class="mono dim label">INGEST</text><text x="44" y="145" class="sans white" font-size="24" font-weight="800">24 sources</text><text x="44" y="169" class="sans muted" font-size="12">Cloud + business data</text><rect x="268" y="82" width="220" height="106" rx="14" fill="#070b12" fill-opacity=".7" stroke="#94a3b8" stroke-opacity=".18"/><text x="286" y="108" class="mono dim label">QUALITY</text><text x="286" y="145" class="sans white" font-size="24" font-weight="800">99.2%</text><text x="286" y="169" class="sans muted" font-size="12">Validated records</text><rect x="26" y="208" width="462" height="164" rx="14" fill="#070b12" fill-opacity=".7" stroke="#94a3b8" stroke-opacity=".18"/><text x="44" y="236" class="mono dim label">DECISION SIGNAL</text><g fill="url(#accent)"><rect x="50" y="302" width="48" height="42" rx="5"/><rect x="114" y="278" width="48" height="66" rx="5"/><rect x="178" y="290" width="48" height="54" rx="5"/><rect x="242" y="252" width="48" height="92" rx="5"/><rect x="306" y="268" width="48" height="76" rx="5"/><rect x="370" y="236" width="48" height="108" rx="5"/></g><rect x="26" y="398" width="150" height="36" rx="18" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-opacity=".3"/><circle cx="47" cy="416" r="4" fill="#10b981"/><text x="101" y="420" text-anchor="middle" class="mono" fill="#8ef0c4" font-size="10">Pipeline healthy</text></g>
  <rect y="680" width="1440" height="440" fill="#0c121d" fill-opacity=".72" stroke="#94a3b8" stroke-opacity=".18"/>
