  <g transform="translate(80 850)"><g><rect width="405" height="220" rx="16" class="card"/><text x="24" y="34" class="mono" fill="#38bdf8" font-size="11">PROJECT / 01</text><text x="24" y="78" class="sans white" font-size="22" font-weight="800">Forensic Analytics</text><text x="24" y="111" class="sans muted" font-size="13">Anomaly detection and investigative analytics</text><text x="24" y="133" class="sans muted" font-size="13">for faster high-risk pattern review.</text><rect x="24" y="164" width="72" height="26" rx="13" fill="#94a3b8" fill-opacity=".08"/><text x="60" y="181" text-anchor="middle" class="mono muted" font-size="9">PYTHON</text></g><g transform="translate(427)"><rect width="405" height="220" rx="16" class="card"/><text x="24" y="34" class="mono" fill="#38bdf8" font-size="11">PROJECT / 02</text><text x="24" y="78" class="sans white" font-size="22" font-weight="800">RetailIQ</text><text x="24" y="111" class="sans muted" font-size="13">Cloud-hosted demand intelligence for retail</text><text x="24" y="133" class="sans muted" font-size="13">forecasting and replenishment decisions.</text><rect x="24" y="164" width="82" height="26" rx="13" fill="#94a3b8" fill-opacity=".08"/><text x="65" y="181" text-anchor="middle" class="mono muted" font-size="9">CLOUD RUN</text></g><g transform="translate(854)"><rect width="405" height="220" rx="16" class="card"/><text x="24" y="34" class="mono" fill="#38bdf8" font-size="11">PROJECT / 03</text><text x="24" y="78" class="sans white" font-size="22" font-weight="800">NexGen Agentic AI</text><text x="24" y="111" class="sans muted" font-size="13">A retrieval and orchestration workspace for</text><text x="24" y="133" class="sans muted" font-size="13">complex, multi-step business questions.</text><rect x="24" y="164" width="58" height="26" rx="13" fill="#94a3b8" fill-opacity=".08"/><text x="53" y="181" text-anchor="middle" class="mono muted" font-size="9">RAG</text></g></g>
