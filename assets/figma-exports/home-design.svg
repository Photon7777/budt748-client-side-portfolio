  <g transform="translate(80 542)"><path d="M0 0V58" stroke="#94a3b8" stroke-opacity=".2"/><text x="18" y="22" class="sans white" font-size="24" font-weight="800">MS ’26</text><text x="18" y="45" class="sans dim" font-size="12">Information Systems &amp; AI</text><path d="M205 0V58" stroke="#94a3b8" stroke-opacity=".2"/><text x="223" y="22" class="sans white" font-size="24" font-weight="800">3</text><text x="223" y="45" class="sans dim" font-size="12">Featured analytics builds</text><path d="M410 0V58" stroke="#94a3b8" stroke-opacity=".2"/><text x="428" y="22" class="sans white" font-size="24" font-weight="800">4</text><text x="428" y="45" class="sans dim" font-size="12">Award recognitions</text></g>
  <g transform="translate(845 142)" filter="url(#shadow)"><rect width="515" height="480" rx="20" class="card"/><circle cx="258" cy="240" r="205" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-dasharray="5 8"/><circle cx="258" cy="240" r="154" fill="none" stroke="#94a3b8" stroke-opacity=".18"/><circle cx="258" cy="240" r="108" fill="#09141d" stroke="#2dd4bf" stroke-opacity=".32"/><rect x="227" y="168" width="62" height="62" rx="20" fill="url(#accent)"/><text x="258" y="206" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#03201d">SP</text><text x="258" y="260" text-anchor="middle" class="sans white" font-size="16" font-weight="800">Data → AI → Action</text><text x="258" y="284" text-anchor="middle" class="sans muted" font-size="11">Useful systems, built end to end</text><g><rect x="34" y="82" width="132" height="34" rx="17" fill="#070b12" stroke="#94a3b8" stroke-opacity=".3"/><circle cx="52" cy="99" r="4" fill="#2dd4bf"/><text x="68" y="103" class="mono white" font-size="10">Data analytics</text></g><g><rect x="350" y="68" width="118" height="34" rx="17" fill="#070b12" stroke="#94a3b8" stroke-opacity=".3"/><circle cx="368" cy="85" r="4" fill="#2dd4bf"/><text x="384" y="89" class="mono white" font-size="10">Applied AI</text></g><g><rect x="190" y="398" width="136" height="34" rx="17" fill="#070b12" stroke="#94a3b8" stroke-opacity=".3"/><circle cx="208" cy="415" r="4" fill="#2dd4bf"/><text x="224" y="419" class="mono white" font-size="10">Cloud delivery</text></g></g>
