  <text x="80" y="164" class="mono teal caps">MS INFORMATION SYSTEMS &amp; AI · UMD SMITH</text>
  <text x="80" y="248" class="sans white" font-size="64" font-weight="800" letter-spacing="-3">I build data products</text>
  <text x="80" y="316" class="sans white" font-size="64" font-weight="800" letter-spacing="-3">that turn <tspan fill="url(#accent)">signals into decisions.</tspan></text>
  <text x="80" y="368" class="sans muted body">I’m Sai Praneeth, a data analyst and AI builder combining reliable</text>
  <text x="80" y="397" class="sans muted body">pipelines, predictive models, and decision-ready dashboards.</text>
  <rect x="80" y="438" width="178" height="48" rx="24" fill="url(#accent)"/><text x="169" y="468" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#03201d">View featured work</text>
