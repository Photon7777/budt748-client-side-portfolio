<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <defs><linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#0c121d"/></linearGradient><linearGradient id="accC" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><pattern id="gridC" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".045"/></pattern><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:'JetBrains Mono',monospace}.w{fill:#f8fafc}.mu{fill:#a8b3c4}.di{fill:#7f8ca3}.t{fill:#2dd4bf}.card{fill:#101722;stroke:#94a3b8;stroke-opacity:.18}.field{fill:#070b12;fill-opacity:.7;stroke:#94a3b8;stroke-opacity:.22}</style></defs>
  <rect width="1440" height="1100" fill="url(#bgC)"/><rect width="1440" height="1100" fill="url(#gridC)"/><rect width="1440" height="76" fill="#070b12" fill-opacity=".9" stroke="#94a3b8" stroke-opacity=".18"/><rect x="80" y="19" width="38" height="38" rx="12" fill="url(#accC)"/><text x="99" y="44" text-anchor="middle" class="m" font-size="12" font-weight="800" fill="#03201d">SP</text><text x="132" y="43" class="s w" font-size="16" font-weight="800">Sai Praneeth Kathi Moksha Gnana</text><g class="s" font-size="14" font-weight="700"><text x="1124" y="43" text-anchor="middle" class="mu">Home</text><text x="1215" y="43" text-anchor="middle" class="mu">About</text><rect x="1268" y="20" width="84" height="36" rx="18" fill="#94a3b8" fill-opacity=".1"/><text x="1310" y="43" text-anchor="middle" class="w">Contact</text></g>
  <text x="80" y="157" class="m t" font-size="13" font-weight="700" letter-spacing="2">CONTACT SAI PRANEETH</text><text x="80" y="234" class="s w" font-size="68" font-weight="800" letter-spacing="-3">Let’s build something</text><text x="80" y="304" class="s" font-size="68" font-weight="800" letter-spacing="-3" fill="url(#accC)">clear and useful.</text><text x="80" y="355" class="s mu" font-size="18">Have an internship, analytics challenge, or project in mind?</text><text x="80" y="383" class="s mu" font-size="18">Send the context and I’ll respond with thoughtful next steps.</text>
  <g transform="translate(80 450)"><rect width="500" height="540" rx="16" class="card"/><text x="30" y="42" class="m t" font-size="12" font-weight="700" letter-spacing="1.5">DIRECT CHANNELS</text><text x="30" y="88" class="s w" font-size="30" font-weight="800">Start where you’re comfortable.</text><text x="30" y="122" class="s mu" font-size="14">Email is best for detailed opportunities.</text><g class="s"><text x="30" y="180" class="m di" font-size="9">EMAIL</text><text x="30" y="205" class="w" font-size="16" font-weight="700">lakhrav@umd.edu</text><text x="450" y="205" class="t" font-size="16">↗</text><path d="M30 226H470" stroke="#94a3b8" stroke-opacity=".18"/><text x="30" y="263" class="m di" font-size="9">PHONE</text><text x="30" y="288" class="w" font-size="16" font-weight="700">(240) 886-7483</text><text x="450" y="288" class="t" font-size="16">↗</text><path d="M30 309H470" stroke="#94a3b8" stroke-opacity=".18"/><text x="30" y="346" class="m di" font-size="9">LINKEDIN</text><text x="30" y="371" class="w" font-size="16" font-weight="700">/in/sai-praneeth-kmg</text><text x="450" y="371" class="t" font-size="16">↗</text><path d="M30 392H470" stroke="#94a3b8" stroke-opacity=".18"/><text x="30" y="429" class="m di" font-size="9">GITHUB</text><text x="30" y="454" class="w" font-size="16" font-weight="700">@Photon7777</text><text x="450" y="454" class="t" font-size="16">↗</text></g></g>
  <g transform="translate(604 450)"><rect width="756" height="540" rx="16" class="card"/><text x="30" y="42" class="m t" font-size="12" font-weight="700" letter-spacing="1.5">SEND A NOTE</text><text x="30" y="88" class="s w" font-size="30" font-weight="800">Tell me what you’re working on.</text><g class="s"><text x="30" y="135" class="mu" font-size="12" font-weight="700">Your name</text><text x="393" y="135" class="mu" font-size="12" font-weight="700">Email address</text><rect x="30" y="148" width="333" height="50" rx="12" class="field"/><rect x="393" y="148" width="333" height="50" rx="12" class="field"/><text x="48" y="179" class="di" font-size="13">Jane Doe</text><text x="411" y="179" class="di" font-size="13">jane@company.com</text><text x="30" y="232" class="mu" font-size="12" font-weight="700">What would you like to discuss?</text><rect x="30" y="245" width="696" height="50" rx="12" class="field"/><text x="48" y="276" class="di" font-size="13">Select a topic</text><text x="30" y="329" class="mu" font-size="12" font-weight="700">Message</text><rect x="30" y="342" width="696" height="112" rx="12" class="field"/><text x="48" y="373" class="di" font-size="13">Share the goal, timeline, and useful context…</text><rect x="30" y="478" width="166" height="44" rx="22" fill="url(#accC)"/><text x="113" y="506" text-anchor="middle" font-size="13" font-weight="800" fill="#03201d">Open email draft</text><text x="215" y="506" class="di" font-size="11">Prepares an email in your default mail app.</text></g></g>
